name: Build data

on:
  schedule:
    - cron: "0 */3 * * 5,6,0,1"   # every 3 h, Friday–Monday (race weekends)
    - cron: "0 6 * * 2,3,4"       # once a day midweek
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache
          key: jolpica-${{ github.run_id }}
          restore-keys: jolpica-
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit changed data
        run: |
          git config user.name "pitboard-bot"
          git config user.email "pitboard-bot@users.noreply.github.com"
          git add docs/api
          # meta.json changes on every run; commit only when real data changed
          if ! git diff --cached --quiet -- docs/api ':!docs/api/meta.json'; then
            git commit -m "Update data" && git push
          fi
